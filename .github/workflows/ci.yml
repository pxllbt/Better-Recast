name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python scripts syntax
        run: |
          python3 -m py_compile scripts/gsr-ipc.py

      - name: Run Smoke Test Suite
        run: |
          bash tests/smoke.sh

      # A directory name is not a command. The output directory reaches the
      # service through the folder browser, and a path can contain a command
      # substitution. This test proves -- against a real shell -- that nothing
      # in it is executed.
      - name: Run Shell Quoting Test
        run: node tests/shell-quoting.test.js
